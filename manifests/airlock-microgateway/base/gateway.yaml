---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: airlock-gateway
  namespace: airlock-gateway
spec:
  infrastructure:
    parametersRef:
      group: microgateway.airlock.com
      kind: GatewayParameters
      name: gatewayparameters
  gatewayClassName: airlock-microgateway
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
