apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: monitoring
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
    - name: loki
      uid: loki
      type: loki
      url: https://lokistack-gateway-http:8080/api/logs/v1/application
      access: proxy
      version: 1
      isDefault: true
      jsonData:
        maxLines: 1000
        tlsSkipVerify: true
        httpHeaderName1: "Authorization"
      secureJsonData:
        httpHeaderValue1: "Bearer $GRAFANA_DATASOURCE_TOKEN"
    - name: tempo
      uid: tempo
      type: tempo
      url: https://tempo-tempo-gateway:8080/api/traces/v1/application
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: GET
        tlsSkipVerify: true
        httpHeaderName1: "Authorization"
        httpHeaderName2: "X-Scope-OrgID"
        serviceMap:
          datasourceUid: prometheus
      secureJsonData:
        httpHeaderValue1: "Bearer $GRAFANA_DATASOURCE_TOKEN"
        httpHeaderValue2: "application"
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc:9091
      isDefault: false
      jsonData:
        tlsSkipVerify: true
        httpHeaderName1: "Authorization"
      secureJsonData:
        httpHeaderValue1: "Bearer $GRAFANA_DATASOURCE_TOKEN"
