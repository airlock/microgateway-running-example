---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: valkey

resources:
- namespace.yaml
- valkey-certificate.yaml

helmCharts:
- name: valkey
  releaseName: valkey
  namespace: valkey
  repo: https://valkey.io/valkey-helm/
  version: 0.11.0
  valuesFile: values.yaml

patches:
- path: delete-helm-test-pod.yaml
- target:
    labelSelector: app.kubernetes.io/instance=valkey
  patch: |-
    - op: add
      path: /metadata/namespace
      value: valkey
---
